name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build & self-checking tests (Icarus Verilog)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # Icarus runs the testbenches; the RISC-V GCC builds the PMP/Smepmp test
      # programs, the official riscv-tests and the benchmarks; Verilator runs
      # CoreMark and Dhrystone.
      - name: Install Icarus Verilog, Verilator and RISC-V GCC
        run: sudo apt-get update && sudo apt-get install -y iverilog verilator gcc-riscv64-unknown-elf

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      # Smoke test: compile the core + SoC and run the self-checking program.
      - name: Smoke test
        run: bash build.sh

      # Golden co-simulation: diff the RTL retire trace against the RV32IM ISA model.
      - name: Golden co-simulation
        run: bash build.sh cosim

      # RVFI (RISC-V Formal Interface) self-check.
      - name: RVFI self-check
        run: bash build.sh rvfi

      # SECURE configuration and unit tests.
      - name: Debug module self-check
        run: bash build.sh debug
      - name: PMP (SECURE)
        run: bash build.sh pmp
      - name: Smepmp rules (SECURE)
        run: bash build.sh epmp
      - name: User-mode privilege checks (SECURE)
        run: bash build.sh upriv
      - name: Smepmp machine mode lockdown (SECURE)
        run: bash build.sh mml
      - name: Register-file ECC
        run: bash build.sh ecc
      - name: AXI4-Lite bus self-check
        run: bash build.sh axil
      - name: FPGA SoC simulation
        run: bash build.sh fpga

      # Official riscv-tests (rv32ui, rv32um, rv32uc, rv32mi) on the default and
      # SECURE builds; exits non-zero on any failing test.
      - name: Official riscv-tests ISA suites
        run: bash run_isa.sh all

      # Benchmarks as regression checks (fail on a simulation FAIL/TIMEOUT or a
      # CoreMark CRC error).
      - name: CoreMark (10 iterations)
        run: bash coremark/run_coremark_10.sh
      - name: Dhrystone
        run: bash dhrystone/run_dhrystone.sh

      # Every target again, compared with the recorded baseline (exit codes and
      # PASS/FAIL verdict counts) in tests/expected.txt.
      - name: Baseline comparison
        run: bash run_tests.sh
