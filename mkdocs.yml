site_name: Kavacha
site_description: A compact, area-optimized RV32IMC processor core
site_author: Kavacha Contributors
copyright: Copyright &copy; 2026 Kavacha Contributors

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - navigation.footer
    - toc.follow
    - content.code.copy
    - search.suggest
    - search.highlight
  icon:
    repo: fontawesome/brands/github

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

nav:
  - Overview & Getting Started:
      - Welcome & Overview: index.md
      - Quick Start & Build Drivers: getting-started.md
      - Configuration Reference: configuration.md

  - Core Architecture (Default Mode):
      - Microarchitecture & Execution FSM: architecture/fsm.md
      - Datapath & Leaf Cells: architecture/datapath.md
      - Memory Interface & Alignment: architecture/memory-interface.md

  - Instruction Set Architecture:
      - RV32IMC Base & Compressed: isa/rv32imc.md
      - Zicsr Extension: isa/zicsr.md
      - Instruction Cycle Timing: isa/timing.md

  - Security Tier (SECURE = 1):
      - Security Tier Overview: security/overview.md
      - User Privilege Mode & Transitions: security/privilege.md
      - 8-Region PMP & ePMP Rules: security/pmp-epmp.md
      - SECDED ECC Register File: security/ecc.md

  - Control & Status Registers:
      - Machine Mode CSRs: csrs/machine-csrs.md
      - Security & ePMP CSRs: csrs/security-csrs.md

  - Traps & Interrupts:
      - Precise Exceptions & Traps: traps/exceptions.md
      - Machine Interrupts & CLINT: traps/interrupts.md

  - Bus Integration & SoC:
      - Native Synchronous Memory Port: integration/native-port.md
      - AXI4-Lite Master Wrapper: integration/axi4-lite.md
      - Reference SoC Top (kavacha_soc): integration/soc-top.md

  - Hardware Debug (Spec 0.13.2):
      - RISC-V External Debug & JTAG DTM: debug/jtag-dtm.md
      - Debug Module (DM) Registers & Control: debug/dm-registers.md

  - Verification & Compliance:
      - Cocotb & Verilator Co-Simulation: verification/cocotb-verilator.md
      - RVFI Formal Interface Compliance: verification/rvfi-compliance.md

  - FPGA & ASIC Synthesis:
      - Xilinx Artix-7 Synthesis & Vivado: synthesis/artix7-vivado.md
      - ASIC Synthesis & OpenLane / Yosys: synthesis/asic-openlane.md

  - Software & Firmware:
      - Firmware Toolchain & Build Driver: software/build-system.md
      - Bare-Metal C & FreeRTOS Porting: software/freertos.md

plugins:
  - search
